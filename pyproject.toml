[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-data-pipeline"
version = "0.1.0"
description = "Serverless S3 -> Lambda -> EventBridge -> Lambda data pipeline (Project August, Day 5)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3==1.43.73",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
